<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barcelona Sounds — A Festival Playlist Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1b1410;
    --paper:#faf5ec;
    --paper2:#f2e9d8;
    --terra:#c1461e;
    --terra-dark:#9c3416;
    --gold:#d9a441;
    --teal:#1f6b64;
    --line:#e3d7c0;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Space Grotesk',sans-serif;
    padding:0 6%;
  }
  header{
    max-width:1100px;
    margin:0 auto;
    padding:64px 0 32px;
    border-bottom:3px solid var(--ink);
  }
  .trip-guide-link{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:12.5px;
    font-weight:600;
    text-decoration:none;
    color:var(--ink);
    background:var(--paper2, #f2e9d8);
    border:1.5px solid var(--line, #e3d7c0);
    border-radius:999px;
    padding:7px 14px;
    margin-bottom:18px;
  }
  .trip-guide-link:hover{background:#fff;border-color:var(--terra);}
  .kicker{
    font-size:13px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--terra);
    font-weight:600;
    margin-bottom:14px;
  }
  h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:clamp(2.6rem,6vw,4.6rem);
    line-height:1.02;
    margin:0 0 18px;
    letter-spacing:-.01em;
  }
  h1 em{
    font-style:italic;
    color:var(--terra);
  }
  .sub{
    font-size:17px;
    max-width:640px;
    line-height:1.55;
    color:#3a2f26;
    margin-bottom:10px;
  }
  .meta-row{
    display:flex;
    gap:24px;
    flex-wrap:wrap;
    margin-top:24px;
    font-size:13px;
    color:#6b5c4a;
  }
  .meta-row strong{color:var(--ink);}

  .controls{
    max-width:1100px;
    margin:0 auto;
    padding:28px 0 10px;
    position:sticky;
    top:0;
    background:var(--paper);
    z-index:5;
  }
  .search-wrap{
    margin-bottom:16px;
  }
  #search{
    width:100%;
    padding:14px 18px;
    font-family:'Space Grotesk',sans-serif;
    font-size:16px;
    border:2px solid var(--ink);
    border-radius:999px;
    background:#fff;
    color:var(--ink);
    outline:none;
  }
  #search::placeholder{color:#9a8a75;}
  .chips{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    padding-bottom:20px;
  }
  .chip{
    padding:8px 16px;
    border-radius:999px;
    border:1.5px solid var(--ink);
    background:transparent;
    font-family:'Space Grotesk',sans-serif;
    font-size:13.5px;
    font-weight:500;
    cursor:pointer;
    color:var(--ink);
    transition:all .15s ease;
    white-space:nowrap;
  }
  .chip:hover{background:var(--paper2);}
  .chip.active{
    background:var(--terra);
    border-color:var(--terra);
    color:#fff;
  }
  .count-line{
    font-size:13px;
    color:#8a7a63;
    padding-bottom:18px;
  }

  main{
    max-width:1100px;
    margin:0 auto;
    padding-bottom:100px;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(310px,1fr));
    gap:18px;
  }
  .card{
    background:#fff;
    border:1.5px solid var(--line);
    border-radius:14px;
    padding:22px 22px 18px;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .card:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 24px rgba(27,20,16,.08);
  }
  .card.hidden{display:none;}
  .card-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
    margin-bottom:6px;
  }
  .artist-name{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:1.28rem;
    line-height:1.2;
  }
  .tag{
    flex-shrink:0;
    font-size:10.5px;
    letter-spacing:.06em;
    text-transform:uppercase;
    font-weight:700;
    padding:4px 9px;
    border-radius:999px;
    color:#fff;
    white-space:nowrap;
  }
  .songs{
    list-style:none;
    margin:14px 0 0;
    padding:0;
    display:flex;
    flex-direction:column;
    gap:9px;
  }
  .song-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding-bottom:9px;
    border-bottom:1px solid #f1e9d9;
  }
  .song-row:last-child{border-bottom:none;padding-bottom:0;}
  .song-title{
    font-size:14.5px;
    color:#2b2118;
    line-height:1.3;
  }
  .song-links{
    display:flex;
    gap:6px;
    flex-shrink:0;
  }
  .listen-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:30px;
    height:30px;
    border-radius:50%;
    text-decoration:none;
    font-size:13px;
    transition:opacity .15s ease;
  }
  .listen-btn:hover{opacity:.75;}
  .sp{background:#1DB954;color:#fff;}
  .am{background:#111;color:#fff;}

  .no-results{
    text-align:center;
    padding:80px 20px;
    color:#9a8a75;
    font-size:15px;
    display:none;
  }

  footer{
    max-width:1100px;
    margin:0 auto;
    padding:36px 0 60px;
    border-top:1.5px solid var(--line);
    font-size:12.5px;
    color:#a3927a;
    line-height:1.7;
  }
  a{color:inherit;}

  .lang-switch{
    position:fixed;
    top:20px;
    right:6%;
    display:flex;
    gap:6px;
    background:#fff;
    border:1.5px solid var(--ink);
    border-radius:999px;
    padding:4px;
    z-index:20;
  }
  .lang-btn{
    border:none;
    background:transparent;
    font-family:'Space Grotesk',sans-serif;
    font-size:12.5px;
    font-weight:600;
    padding:6px 12px;
    border-radius:999px;
    cursor:pointer;
    color:var(--ink);
    letter-spacing:.03em;
    display:inline-flex;
    align-items:center;
    gap:6px;
  }
  .flag-icon{
    width:18px;
    height:13px;
    border-radius:2px;
    display:block;
    flex-shrink:0;
    box-shadow:0 0 0 1px rgba(0,0,0,.12);
  }
  .lang-btn.active{
    background:var(--ink);
    color:#fff;
  }
  @media (max-width:640px){
    .lang-switch{position:static;justify-content:flex-end;margin-bottom:12px;}
  }

  .hb-banner{
    max-width:1100px;
    margin:0 auto 0;
    padding-top:8px;
  }
  .hb-outer{
    width:100%;
  }
  .hb-outer summary.hb-teaser{
    cursor:pointer;
    list-style:none;
    display:flex;
    align-items:center;
    gap:12px;
    background:linear-gradient(135deg,var(--terra) 0%,var(--terra-dark) 100%);
    color:#fff;
    padding:15px 22px;
    border-radius:999px;
    font-weight:600;
    font-size:14.5px;
    box-shadow:0 4px 16px rgba(193,70,30,.28);
    transition:transform .15s ease;
  }
  .hb-outer summary.hb-teaser:hover{transform:translateY(-1px);}
  .hb-outer summary.hb-teaser::-webkit-details-marker{display:none;}
  .hb-teaser-icon{font-size:17px;flex-shrink:0;}
  .hb-teaser-text{flex:1;}
  .hb-teaser-chevron{
    font-size:19px;
    flex-shrink:0;
    transition:transform .2s ease;
    opacity:.85;
  }
  .hb-outer[open] .hb-teaser-chevron{transform:rotate(90deg);}
  .hb-outer[open] summary.hb-teaser{border-radius:16px 16px 0 0;}
  .hb-card{
    background:linear-gradient(135deg,var(--teal) 0%,#164f4a 100%);
    border-radius:0 0 16px 16px;
    padding:22px 26px;
    color:#fff;
  }
  .hb-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
  }
  .hb-badge{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-size:12px;
    font-weight:700;
    letter-spacing:.08em;
    text-transform:uppercase;
    background:rgba(255,255,255,.14);
    padding:6px 12px;
    border-radius:999px;
    margin-bottom:10px;
  }
  .hb-badge .dot{
    width:7px;height:7px;border-radius:50%;
    background:var(--gold);
    display:inline-block;
  }
  .hb-headline{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:clamp(1.3rem,2.6vw,1.8rem);
    line-height:1.25;
    max-width:600px;
    margin:0;
  }
  .hb-cta{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:var(--gold);
    color:var(--ink);
    text-decoration:none;
    font-weight:700;
    font-size:14.5px;
    padding:13px 22px;
    border-radius:999px;
    white-space:nowrap;
    flex-shrink:0;
    transition:transform .15s ease;
  }
  .hb-cta:hover{transform:translateY(-1px);}

  .hb-accordion{
    margin-top:16px;
    border-top:1px solid rgba(255,255,255,.2);
    padding-top:14px;
  }
  .hb-accordion summary{
    cursor:pointer;
    list-style:none;
    font-size:13.5px;
    font-weight:600;
    display:flex;
    align-items:center;
    gap:8px;
    color:#fff;
    opacity:.92;
  }
  .hb-accordion summary::-webkit-details-marker{display:none;}
  .hb-accordion summary::before{
    content:'▸';
    font-size:11px;
    transition:transform .15s ease;
    display:inline-block;
  }
  .hb-accordion[open] summary::before{
    transform:rotate(90deg);
  }
  .hb-steps{
    margin:14px 0 2px;
    padding:0;
    list-style:none;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .hb-steps li{
    background:rgba(255,255,255,.09);
    border-radius:10px;
    padding:10px 14px;
    font-size:13px;
    line-height:1.5;
    color:#eef7f5;
  }
  .hb-steps .step-num{
    font-weight:700;
    color:var(--gold);
    margin-right:6px;
  }
</style>
</head>

let activeCat = "all";
let query = "";

function spotifyURL(artist, song){
  return "https://open.spotify.com/search/" + encodeURIComponent(artist + " " + song);
}
function appleURL(artist, song){
  return "https://music.apple.com/search?term=" + encodeURIComponent(artist + " " + song);
}

function buildChips(){
  const chips = document.getElementById('chips');
  chips.innerHTML = '';
  const allChip = document.createElement('button');
  allChip.className = 'chip' + (activeCat==='all' ? ' active' : '');
  allChip.textContent = I18N[currentLang].allGenres;
  allChip.dataset.cat = 'all';
  chips.appendChild(allChip);
  Object.keys(CATS).forEach(k=>{
    const btn = document.createElement('button');
    btn.className = 'chip' + (activeCat===k ? ' active' : '');
    btn.textContent = CATS[k].label[currentLang];
    btn.dataset.cat = k;
    chips.appendChild(btn);
  });
  chips.addEventListener('click', e=>{
    const btn = e.target.closest('.chip');
    if(!btn) return;
    activeCat = btn.dataset.cat;
    [...chips.children].forEach(c=>c.classList.toggle('active', c===btn));
    render();
  });
}

function buildGrid(){
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  DATA.forEach(item=>{
    const cat = CATS[item.c];
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.cat = item.c;
    card.dataset.search = (item.a + ' ' + item.s.join(' ')).toLowerCase();

    const top = document.createElement('div');
    top.className = 'card-top';
    const name = document.createElement('div');
    name.className = 'artist-name';
    name.textContent = item.a;
    const tag = document.createElement('div');
    tag.className = 'tag';
    tag.textContent = cat.label[currentLang];
    tag.style.background = cat.color;
    top.appendChild(name);
    top.appendChild(tag);
    card.appendChild(top);

    const list = document.createElement('ul');
    list.className = 'songs';
    item.s.forEach(song=>{
      const li = document.createElement('li');
      li.className = 'song-row';
      const title = document.createElement('span');
      title.className = 'song-title';
      title.textContent = song;
      const links = document.createElement('span');
      links.className = 'song-links';
      const sp = document.createElement('a');
      sp.className = 'listen-btn sp';
      sp.href = spotifyURL(item.a, song);
      sp.target = '_blank';
      sp.rel = 'noopener noreferrer';
      sp.title = I18N[currentLang].spTitle;
      sp.textContent = '♫';
      const am = document.createElement('a');
      am.className = 'listen-btn am';
      am.href = appleURL(item.a, song);
      am.target = '_blank';
      am.rel = 'noopener noreferrer';
      am.title = I18N[currentLang].amTitle;
      am.innerHTML = '&#9835;';
      links.appendChild(sp);
      links.appendChild(am);
      li.appendChild(title);
      li.appendChild(links);
      list.appendChild(li);
    });
    card.appendChild(list);
    grid.appendChild(card);
  });
}

function render(){
  const cards = document.querySelectorAll('.card');
  let visible = 0, songTotal = 0;
  cards.forEach(card=>{
    const catMatch = activeCat === 'all' || card.dataset.cat === activeCat;
    const qMatch = query === '' || card.dataset.search.includes(query);
    const show = catMatch && qMatch;
    card.classList.toggle('hidden', !show);
    if(show){
      visible++;
      songTotal += card.querySelectorAll('.song-row').length;
    }
  });
  document.getElementById('artistCount').textContent = visible;
  document.getElementById('songCount').textContent = songTotal;
  document.getElementById('countLine').textContent = I18N[currentLang].countLine(visible);
  document.getElementById('noResults').style.display = visible === 0 ? 'block' : 'none';
}

function applyStaticText(){
  const t = I18N[currentLang];
  document.getElementById('tripGuideLink').textContent = t.tripGuideLink;
  document.getElementById('txt-kicker').textContent = t.kicker;
  document.getElementById('txt-h1').innerHTML = t.h1;
  document.getElementById('txt-sub').textContent = t.sub;
  document.getElementById('txt-artists').textContent = t.artists;
  document.getElementById('txt-tracks').textContent = t.tracks;
  document.getElementById('txt-updated').textContent = t.updated;
  document.getElementById('search').placeholder = t.searchPlaceholder;
  document.getElementById('noResults').textContent = t.noResults;
  document.getElementById('txt-footer').textContent = t.footer;
  document.documentElement.lang = currentLang;

  document.getElementById('hb-teaser-text').textContent = t.hbTeaser;
  document.getElementById('hb-badge-txt').textContent = t.hbBadge;
  document.getElementById('hb-headline').textContent = t.hbHeadline;
  document.getElementById('hb-cta').textContent = t.hbCta;
  document.getElementById('hb-accordion-title').textContent = t.hbAccordion;
  const stepsEl = document.getElementById('hb-steps');
  stepsEl.innerHTML = '';
  t.hbSteps.forEach((step, i)=>{
    const li = document.createElement('li');
    li.innerHTML = '<span class="step-num">' + (i+1) + '.</span>' + step;
    stepsEl.appendChild(li);
  });
}

function setLanguage(lang){
  currentLang = lang;
  document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active', b.dataset.lang===lang));
  applyStaticText();
  buildChips();
  buildGrid();
  render();
}

document.getElementById('search').addEventListener('input', e=>{
  query = e.target.value.trim().toLowerCase();
  render();
});

document.getElementById('langSwitch').addEventListener('click', e=>{
  const btn = e.target.closest('.lang-btn');
  if(!btn) return;
  setLanguage(btn.dataset.lang);
});

setLanguage('ca');
